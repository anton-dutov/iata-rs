name: Build and test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Default features
            flags: ''
          - name: Datetime only
            flags: --no-default-features
          - name: Datetime with Serde
            flags: --no-default-features --features with-serde
          - name: All features
            flags: --all-features
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo +stable build ${{ matrix.flags }}
      - name: Test
        run: cargo +stable test --locked ${{ matrix.flags }}
